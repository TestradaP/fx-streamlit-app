[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modulo-11-usdcop"
version = "0.1.0"
description = "Modulo Streamlit de inteligencia cambiaria USD/COP"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.37",
  "pandas>=2.2",
  "numpy>=1.26",
  "requests>=2.31",
  "pyarrow>=15",
  "scikit-learn==1.6.1",
  "statsmodels>=0.14",
  "plotly>=5.22",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "openpyxl>=3.1",
  "python-dotenv>=1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
