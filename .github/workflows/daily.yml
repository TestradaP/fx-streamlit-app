name: usdcop-daily

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * 1-5"  # 06:15 America/Bogota
    - cron: "15 22 * * 1-5"  # 17:15 America/Bogota
    - cron: "15 12 * * 6"    # Saturday weekly challenger retraining

permissions:
  contents: write

concurrency:
  group: usdcop-daily-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore accumulated point-in-time vintages
        uses: actions/cache@v4
        with:
          path: modulo_11_usdcop/data/store/vintages
          key: usdcop-vintages-${{ github.run_id }}
          restore-keys: |
            usdcop-vintages-
      - run: python -m pip install -r modulo_11_usdcop/requirements.txt
      - run: python -m pip install -e ./modulo_11_usdcop
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s modulo_11_usdcop/tests -v
      - run: python modulo_11_usdcop/scripts/update_daily.py
        env:
          # Configure this as a repository secret; it is never stored in source.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Retrain challengers with current point-in-time snapshot
        run: python modulo_11_usdcop/scripts/train_models.py
      - run: python modulo_11_usdcop/scripts/run_backtest.py
      - run: python modulo_11_usdcop/scripts/run_forecast.py
      - uses: actions/upload-artifact@v4
        with:
          name: usdcop-data-${{ github.run_id }}
          path: |
            modulo_11_usdcop/data/store
            modulo_11_usdcop/outputs
          retention-days: 30
      - name: Publish forecast for Streamlit Cloud
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulo_11_usdcop/outputs/latest_forecasts.csv
          git add modulo_11_usdcop/outputs/forecast_drivers.csv
          git add modulo_11_usdcop/outputs/forecast_status.json
          git add modulo_11_usdcop/outputs/data_quality_latest.json
          git add modulo_11_usdcop/outputs/point_in_time_coverage.json
          git add modulo_11_usdcop/outputs/backtest_metrics.csv
          git add modulo_11_usdcop/outputs/backtest_predictions.csv
          git add modulo_11_usdcop/outputs/backtest_window_metrics.csv
          git add modulo_11_usdcop/outputs/backtest_regime_metrics.csv
          git add modulo_11_usdcop/outputs/champion_registry.json
          git add modulo_11_usdcop/outputs/model_validation.json
          git add modulo_11_usdcop/outputs/model_monitor.json
          git add modulo_11_usdcop/outputs/champion_model.txt
          git add modulo_11_usdcop/outputs/candidate_models_latest.joblib
          git add modulo_11_usdcop/outputs/model_metadata_latest.json
          if git diff --cached --quiet; then
            echo "Forecast files are already current."
            exit 0
          fi
          git commit -m "chore: publish daily USD/COP forecast [skip ci]"
          git push origin HEAD:main

# Los archivos de pronostico pequeños se publican en main para que Streamlit
# Cloud se redespliegue. El store histórico completo permanece como artifact.
