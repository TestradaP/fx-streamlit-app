name: usdcop-daily

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * 1-5"  # 06:15 America/Bogota
    - cron: "15 22 * * 1-5"  # 17:15 America/Bogota

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python scripts/update_daily.py
      - run: python scripts/run_forecast.py || true
      - uses: actions/upload-artifact@v4
        with:
          name: usdcop-data-${{ github.run_id }}
          path: |
            data/store
            outputs
          retention-days: 30

# Importante: los runners son efimeros. Para produccion, reemplace artifacts por
# PostgreSQL/object storage persistente y gestione secretos mediante el entorno.
